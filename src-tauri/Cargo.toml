[package]
name = "agenticcrew"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop-shell"]
desktop-shell = ["tauri", "tauri-build"]

[lib]
name = "agenticcrew_desktop"
path = "src/lib.rs"

[[bin]]
name = "agenticcrew-sidecar"
path = "src/bin/agenticcrew-sidecar.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
