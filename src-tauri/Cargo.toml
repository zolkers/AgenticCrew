[package]
name = "agentos"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop-shell"]
desktop-shell = ["tauri", "tauri-build"]

[lib]
name = "agentos_desktop"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [], optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
serde_json = "1"
