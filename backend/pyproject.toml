[project]
name = "agentos-core"
version = "0.1.0"
description = "Local AgentOS core API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.2",
  "pydantic>=2.12.5",
  "uvicorn>=0.38.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.19.1",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.8"
]

[tool.pytest.ini_options]
addopts = "--cov=agentos_core --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
